name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fence-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run fence:selftest
      - run: npm run fence
      - run: npm run check
      - run: npm run build
